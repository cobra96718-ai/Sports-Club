<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marksheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }
    .marksheet {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border: 2px solid #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #222;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      text-transform: uppercase;
    }
    .student-info {
      margin-bottom: 20px;
    }
    .student-info p {
      margin: 5px 0;
      font-size: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    table, th, td {
      border: 1px solid #444;
    }
    th, td {
      padding: 10px;
      text-align: center;
      font-size: 15px;
    }
    .total {
      font-weight: bold;
      background: #f2f2f2;
    }
    .footer {
      text-align: right;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="marksheet">
    <div class="header">
      <h1>Delhi Public School</h1>
      <p><strong>Academic Report Card - 2025</strong></p>
    </div>

    <div class="student-info">
      <p><strong>Name:</strong> Sachin Yadav</p>
      <p><strong>Class:</strong> 12th</p>
      <p><strong>Roll No:</strong> 23</p>
    </div>

    <table>
      <tr>
        <th>Subject</th>
        <th>Marks Obtained</th>
        <th>Maximum Marks</th>
      </tr>
      <tr>
        <td>Mathematics</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr>
        <td>chemistry</td>
        <td>92</td>
        <td>100</td>
      </tr>
      <tr>
        <td>English</td>
        <td>81</td>
        <td>100</td>
      </tr>
      <tr>
        <td>physics</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Hindi</td>
        <td>78</td>
        <td>100</td>
      </tr>
      <tr class="total">
        <td>Total</td>
        <td>424</td>
        <td>500</td>
      </tr>
    </table>

    <p><strong>Percentage:</strong> 84.8%</p>
    <p><strong>Result:</strong> Pass</p>

    <div class="footer">
    
    </div>
  </div>

</body>
</html>
